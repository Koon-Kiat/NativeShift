version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: Update
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /src/NativeShift.App
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    labels: [dependencies, nuget]
    commit-message:
      prefix: Update
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

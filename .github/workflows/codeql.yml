name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 17 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ security-extended analysis
    runs-on: windows-2025
    timeout-minutes: 150
    permissions:
      contents: read
      security-events: write
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\out\vcpkg-cache,readwrite
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - name: Check out clean source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: out/vcpkg-cache
          key: codeql-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          languages: c-cpp
          queries: security-extended
      - name: Configure clean Release build
        shell: pwsh
        run: |
          . ./scripts/initialize-build-environment.ps1
          Initialize-NativeBuildEnvironment
          cmake --preset release
      - name: Compile observed C++
        shell: pwsh
        run: |
          . ./scripts/initialize-build-environment.ps1
          Initialize-NativeBuildEnvironment
          cmake --build --preset release
      - name: Analyze
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          category: /language:c-cpp

  actions:
    name: GitHub Actions analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out clean source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          languages: actions
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          category: /language:actions

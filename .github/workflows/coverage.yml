name: Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Project-owned native coverage
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\out\vcpkg-cache,readwrite
      VCPKG_MAX_CONCURRENCY: 4
    steps:
      - name: Check out clean source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/vcpkg-cache
          key: vcpkg-${{ runner.os }}-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-x64-
      - name: Install pinned coverage tool
        shell: pwsh
        run: |
          choco install opencppcoverage --version=0.9.9.0 --yes --no-progress
          'C:\Program Files\OpenCppCoverage' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Configure and build Debug
        shell: pwsh
        run: |
          . ./scripts/initialize-build-environment.ps1
          Initialize-NativeBuildEnvironment
          cmake --preset debug
          cmake --build --preset debug
      - name: Enforce line coverage gate
        shell: pwsh
        run: ./scripts/run-coverage.ps1 -MinimumLinePercent 65
      - name: Upload human and machine reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NativeShift-coverage
          path: out/coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Write job summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./out/coverage/cobertura.xml) {
            [xml]$report = Get-Content ./out/coverage/cobertura.xml -Raw
            $percent = [math]::Round([double]::Parse(
              $report.coverage.'line-rate',
              [Globalization.CultureInfo]::InvariantCulture) * 100, 2)
            "## Native coverage`n`nProject-owned line coverage: **$percent%** (minimum 65%)." |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

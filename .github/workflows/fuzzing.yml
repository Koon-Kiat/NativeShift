name: ClusterFuzzLite

on:
  pull_request:
    branches: [main]
    paths:
      - .clusterfuzzlite/**
      - .github/workflows/fuzzing.yml
      - fuzz/**
      - src/NativeShift.Core/**
  schedule:
    - cron: '41 18 * * 5'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: fuzzing-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: AddressSanitizer fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out clean source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build instrumented fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c++
          sanitizer: address
          github-token: ${{ github.token }}
      - name: Run instrumented fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && '180' || '600' }}
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          sanitizer: address
          parallel-fuzzing: true
          output-sarif: >-
            ${{ github.event_name != 'pull_request' ||
                github.event.pull_request.head.repo.full_name == github.repository }}

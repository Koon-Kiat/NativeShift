name: Nightly analysis

on:
  schedule:
    - cron: '41 18 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: MSVC and independent static analysis
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\out\vcpkg-cache,readwrite
      VCPKG_MAX_CONCURRENCY: 4
    steps:
      - name: Check out clean source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/vcpkg-cache
          key: vcpkg-${{ runner.os }}-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-x64-
      - name: Install pinned cppcheck
        shell: pwsh
        run: choco install cppcheck --version=2.18.0 --yes --no-progress
      - name: Run clang-tidy, cppcheck, and MSVC analyze
        shell: pwsh
        run: ./scripts/run-static-analysis.ps1
      - name: Build and run benchmarks
        shell: pwsh
        run: |
          . ./scripts/initialize-build-environment.ps1
          Initialize-NativeBuildEnvironment
          cmake --preset release
          cmake --build --preset release --parallel 4
          $benchmarkJson = & ./out/build/nativeshift-release/benchmarks/NativeShift.Benchmarks.exe --include-media
          if ($LASTEXITCODE -ne 0) {
            throw "NativeShift.Benchmarks exited with code $LASTEXITCODE."
          }
          $benchmarkJson | Out-String | ConvertFrom-Json | Out-Null
          $benchmarkJson | Set-Content ./out/nightly-benchmark.json -Encoding utf8
      - name: Upload analysis evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-analysis
          path: |
            out/analysis/
            out/nightly-benchmark.json
          if-no-files-found: warn
          retention-days: 14


name: Nightly analysis

on:
  schedule:
    - cron: '41 18 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: MSVC and independent static analysis
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\out\vcpkg-cache,readwrite
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - name: Check out clean source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: out/vcpkg-cache
          key: nightly-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
      - name: Install pinned cppcheck
        shell: pwsh
        run: choco install cppcheck --version=2.18.0 --yes --no-progress
      - name: Run clang-tidy, cppcheck, and MSVC analyze
        shell: pwsh
        run: ./scripts/run-static-analysis.ps1
      - name: Build and run benchmarks
        shell: pwsh
        run: |
          . ./scripts/initialize-build-environment.ps1
          Initialize-NativeBuildEnvironment
          cmake --preset release
          cmake --build --preset release
          ./out/build/nativeshift-release/benchmarks/nativeshift-benchmark.exe --output ./out/nightly-benchmark.json
      - name: Upload analysis evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-analysis
          path: |
            out/analysis/
            out/nightly-benchmark.json
          if-no-files-found: warn
          retention-days: 14

name: Portable package candidates

on:
  workflow_dispatch:
    inputs:
      include_msix:
        description: Also build the unsigned development MSIX
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and verify portable packages
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\out\vcpkg-cache,readwrite
      VCPKG_MAX_CONCURRENCY: 4
    steps:
      - name: Check out clean source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/vcpkg-cache
          key: vcpkg-${{ runner.os }}-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-x64-
      - name: Build and verify package candidates
        shell: pwsh
        env:
          INCLUDE_MSIX: ${{ inputs.include_msix }}
        run: |
          $parameters = @{ Version = '0.2.0' }
          if ($env:INCLUDE_MSIX -eq 'true') {
            $parameters.IncludeMsix = $true
          }
          ./scripts/build-packages.ps1 @parameters
          ./scripts/verify-packages.ps1 @parameters
      - name: Upload portable test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NativeShift-0.2.0-portable-candidates
          path: out/packages/
          if-no-files-found: error
          retention-days: 7
